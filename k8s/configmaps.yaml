apiVersion: v1
kind: ConfigMap
metadata:
  name: ipsec-config
  labels:
    app: ipsec-anomaly-system
data:
  NODE_ENV: "production"
  # AWS SQS Queue URL
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/123456789012/ipsec-anomaly-queue"
  # Hosted Vue frontend (for CORS), Github hosting
  CLIENT_ORIGIN: "http://ipsec-dashboard.local"